openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Private object storage for resident evidence.
  - name: Translation
    description: English translations for City staff review.
  - name: Staff
    description: City staff authentication for evidence review.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/evidence:
    post:
      operationId: uploadEvidence
      tags: [Storage]
      summary: Upload private photo evidence
      description: Uploads one validated image to managed private object storage.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Evidence stored in private object storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUploadResponse"
        "400":
          description: The uploaded bytes are not a supported image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The image exceeds the 3 MB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The content type is not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The evidence could not be stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getEvidenceObject
      tags: [Storage]
      summary: Serve a private evidence object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Private evidence path without the /objects/ prefix.
        - name: x-resident-preview-token
          in: header
          required: false
          schema:
            type: string
          description: Short-lived capability returned for the submitting resident's confirmation preview.
      responses:
        "200":
          description: Stored image evidence.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Evidence object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Staff authentication or a resident preview capability is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The evidence could not be served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /translate/report:
    post:
      operationId: translateReport
      tags: [Translation]
      summary: Translate resident report text into English
      description: Preserves the resident's original text and returns an English translation for City staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportTranslationInput"
      responses:
        "200":
          description: English translation of the resident-entered report fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTranslationResponse"
        "400":
          description: Invalid translation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Translation service is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Translation provider failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /staff/login:
    post:
      operationId: staffLogin
      tags: [Staff]
      summary: Authenticate a City staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginInput"
      responses:
        "200":
          description: Staff session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "400":
          description: Credentials are missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Credentials are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Staff access has not been configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /staff/session:
    get:
      operationId: getStaffSession
      tags: [Staff]
      summary: Get the current City staff session
      responses:
        "200":
          description: Current staff session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "401":
          description: No valid staff session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /staff/logout:
    post:
      operationId: staffLogout
      tags: [Staff]
      summary: End the current City staff session
      responses:
        "204":
          description: Staff session cleared.
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EvidenceUploadResponse:
      type: object
      properties:
        objectPath:
          type: string
          description: Private object path returned by the evidence service.
        contentType:
          type: string
        size:
          type: integer
        previewToken:
          type: string
          description: Short-lived capability for the submitting resident's confirmation preview.
      required:
        - objectPath
        - contentType
        - size
        - previewToken
    StaffLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    StaffSession:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - city-evidence-reviewer
            - city-admin
      required:
        - authenticated
        - email
        - role
    ReportTranslationInput:
      type: object
      properties:
        sourceLanguage:
          type: string
          minLength: 2
          maxLength: 10
        location:
          type: string
          maxLength: 300
        approximateTime:
          type: string
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - sourceLanguage
        - location
        - approximateTime
        - description
    ReportTranslationResponse:
      type: object
      properties:
        location:
          type: string
        approximateTime:
          type: string
        description:
          type: string
      required:
        - location
        - approximateTime
        - description
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required:
        - error

