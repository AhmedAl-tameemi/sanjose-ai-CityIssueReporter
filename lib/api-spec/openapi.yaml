openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Private object storage for resident evidence.
  - name: Translation
    description: English translations for City staff review.
  - name: Staff
    description: City staff authentication for evidence review.
paths:
  /city-accidents:
    get:
      operationId: listCityAccidents
      summary: Paginated database of official City traffic collisions
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: sort
          schema: { type: string, enum: [type, date], default: type }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
        - in: query
          name: accidentType
          schema: { type: string, maxLength: 150 }
        - in: query
          name: year
          schema: { type: string, pattern: '^(all|20[0-9]{2})$', default: all }
      responses:
        "200":
          description: Stored public collision records with sorting, filtering, and synchronization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityAccidentList"
        "400":
          description: Invalid list options
        "503":
          description: Accident database is temporarily unavailable
  /city-incidents:
    get:
      operationId: listCityIncidents
      summary: Public City of San José historical traffic collisions
      description: Queries the City's public Crash Locations Last Five Years dataset for a map area. Never returns private TrafficSignal submissions.
      parameters:
        - in: query
          name: bbox
          required: true
          description: West,south,east,north in WGS84. The area must be at most four degrees wide and high.
          schema:
            type: string
        - in: query
          name: year
          schema:
            type: string
            pattern: '^(all|20[0-9]{2})$'
            default: all
        - in: query
          name: severity
          schema:
            type: string
            enum: [all, fatal, severe, injury, none]
            default: all
      responses:
        "200":
          description: Latest mapped collisions in the selected area, with explicit record limit and City source attribution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityIncidentMap"
        "400":
          description: Invalid map area or filters.
        "503":
          description: City public data is temporarily unavailable.
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/evidence:
    post:
      operationId: uploadEvidence
      tags: [Storage]
      summary: Upload private photo, audio, or video evidence
      description: Validates one evidence file and stores it privately. A report can include up to 5 attachments with a combined size of 25 MiB. Images are limited to 3 MiB, audio to 10 MiB, and video to 20 MiB per file.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
          audio/webm:
            schema: { type: string, format: binary }
          audio/mp4:
            schema: { type: string, format: binary }
          audio/ogg:
            schema: { type: string, format: binary }
          audio/mpeg:
            schema: { type: string, format: binary }
          audio/wav:
            schema: { type: string, format: binary }
          video/webm:
            schema: { type: string, format: binary }
          video/mp4:
            schema: { type: string, format: binary }
          video/quicktime:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Evidence stored in private object storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUploadResponse"
        "400":
          description: The uploaded bytes do not match a supported media container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The evidence exceeds its media-specific size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The content type is not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The evidence could not be stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getEvidenceObject
      tags: [Storage]
      summary: Serve a private evidence object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Private evidence path without the /objects/ prefix.
        - name: x-resident-preview-token
          in: header
          required: false
          schema:
            type: string
          description: Short-lived capability returned for the submitting resident's confirmation preview.
      responses:
        "200":
          description: Stored photo, audio, or video evidence.
          content:
            image/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema: { type: string, format: binary }
            video/*:
              schema: { type: string, format: binary }
        "404":
          description: Evidence object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Staff authentication or a resident preview capability is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The evidence could not be served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /translate/report:
    post:
      operationId: translateReport
      tags: [Translation]
      summary: Translate resident report text into English
      description: Preserves the resident's original text and returns an English translation for City staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportTranslationInput"
      responses:
        "200":
          description: English translation of the resident-entered report fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTranslationResponse"
        "400":
          description: Invalid translation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Translation service is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Translation provider failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /staff/login:
    post:
      operationId: staffLogin
      tags: [Staff]
      summary: Authenticate a City staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginInput"
      responses:
        "200":
          description: Staff session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "400":
          description: Credentials are missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Credentials are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Staff access has not been configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /staff/session:
    get:
      operationId: getStaffSession
      tags: [Staff]
      summary: Get the current City staff session
      responses:
        "200":
          description: Current staff session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "401":
          description: No valid staff session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /staff/logout:
    post:
      operationId: staffLogout
      tags: [Staff]
      summary: End the current City staff session
      responses:
        "204":
          description: Staff session cleared.
  /reports:
    get:
      operationId: listTrafficReports
      tags: [Reports]
      summary: List reports available to the current resident or staff member
      description: Residents receive only reports tied to their private browser session; authenticated staff receive all reports.
      responses:
        "200":
          description: Reports newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficReportHistory"
    post:
      operationId: createTrafficReport
      tags: [Reports]
      summary: Save a resident traffic-safety report
      description: A report may include up to 5 private evidence files with a combined size of no more than 25 MiB. Existing clients may submit one evidence object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrafficReportInput"
      responses:
        "201":
          description: Report saved; AI analysis may be pending or unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficReport"
        "400":
          description: Invalid report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Persistent report storage is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /reports/session:
    post:
      operationId: ensureResidentReportSession
      tags: [Reports]
      summary: Establish a private persistent resident browser session
      responses:
        "204":
          description: The resident session is ready for report submission.
  /reports/{reportId}/evidence:
    get:
      operationId: readTrafficReportEvidence
      tags: [Reports]
      summary: Read evidence belonging to an authorized report
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private evidence for its submitting resident or authenticated staff.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Report or evidence not available to this viewer.
  /reports/{reportId}/evidence/{evidenceIndex}:
    get:
      operationId: readTrafficReportEvidenceItem
      tags: [Reports]
      summary: Read one evidence attachment from an authorized report
      parameters:
        - in: path
          name: reportId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: evidenceIndex
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Private evidence for its submitting resident or authenticated staff.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Report or evidence not available to this viewer.
components:
  schemas:
    CityAccidentList:
      type: object
      required: [incidents, total, page, pageSize, accidentTypes, availableYears, lastSyncedAt, syncStatus, skippedCount, sourceUrl]
      properties:
        incidents:
          type: array
          items: { $ref: "#/components/schemas/CityIncident" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        accidentTypes:
          type: array
          items: { type: string }
        availableYears:
          type: array
          items: { type: string }
        lastSyncedAt:
          type: [string, "null"]
          format: date-time
        syncStatus:
          type: string
          enum: [pending, syncing, ready, error]
        skippedCount: { type: integer }
        sourceUrl: { type: string, format: uri }
    CityIncident:
      type: object
      required: [id, latitude, longitude, occurredAt, year, location, collisionType, severity]
      properties:
        id:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        occurredAt:
          type: [string, "null"]
          format: date-time
        year:
          type: string
        location:
          type: string
        collisionType:
          type: string
        severity:
          type: string
          enum: [fatal, severe, injury, none, unknown]
    CityIncidentMap:
      type: object
      required: [incidents, totalMatched, limit, truncated, unmappedCount, availableYears, fetchedAt, sourceName, sourceUrl]
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/CityIncident"
        totalMatched:
          type: integer
          minimum: 0
        limit:
          type: integer
        truncated:
          type: boolean
        unmappedCount:
          type: integer
          minimum: 0
        availableYears:
          type: array
          items:
            type: string
        fetchedAt:
          type: string
          format: date-time
        sourceName:
          type: string
        sourceUrl:
          type: string
          format: uri
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EvidenceUploadResponse:
      type: object
      properties:
        objectPath:
          type: string
          description: Private object path returned by the evidence service.
        contentType:
          type: string
        size:
          type: integer
        previewToken:
          type: string
          description: Short-lived capability for the submitting resident's confirmation preview.
      required:
        - objectPath
        - contentType
        - size
        - previewToken
    StaffLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    StaffSession:
      type: object
      properties:
        authenticated:
          type: boolean
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - city-evidence-reviewer
            - city-admin
      required:
        - authenticated
        - email
        - role
    ReportTranslationInput:
      type: object
      properties:
        sourceLanguage:
          type: string
          minLength: 2
          maxLength: 10
        location:
          type: string
          maxLength: 300
        approximateTime:
          type: string
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - sourceLanguage
        - location
        - approximateTime
        - description
    ReportTranslationResponse:
      type: object
      properties:
        location:
          type: string
        approximateTime:
          type: string
        description:
          type: string
      required:
        - location
        - approximateTime
        - description
    TrafficReportInput:
      type: object
      properties:
        clientSubmissionId:
          type: string
          format: uuid
        originalReport:
          $ref: "#/components/schemas/TrafficReportOriginal"
        evidence:
          oneOf:
            - $ref: "#/components/schemas/TrafficReportEvidenceInput"
            - type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/TrafficReportEvidenceInput"
            - type: "null"
        language:
          type: string
          minLength: 2
          maxLength: 10
        englishTranslation:
          oneOf:
            - $ref: "#/components/schemas/ReportTranslationResponse"
            - type: "null"
      required:
        - clientSubmissionId
        - originalReport
        - evidence
        - language
        - englishTranslation
    TrafficReportOriginal:
      type: object
      properties:
        issueType:
          type: string
          enum: [Unsafe driving, Speeding, Potholes, Illegal dumping, Streetlight problems, Other]
        location:
          type: ["string", "null"]
          maxLength: 300
        searchedAddress:
          type: ["string", "null"]
          maxLength: 300
        pinLatitude:
          type: ["number", "null"]
          minimum: -90
          maximum: 90
        pinLongitude:
          type: ["number", "null"]
          minimum: -180
          maximum: 180
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        approximateTime:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 15
          maxLength: 500
        frequency:
          type: string
          enum: [One time, A few times, Happens often, Happens every day]
        name:
          type: ["string", "null"]
          maxLength: 200
        email:
          type: ["string", "null"]
          format: email
          maxLength: 320
        phone:
          type: ["string", "null"]
          maxLength: 80
      required:
        - issueType
        - location
        - searchedAddress
        - pinLatitude
        - pinLongitude
        - date
        - approximateTime
        - description
        - frequency
        - name
        - email
        - phone
    TrafficReportEvidenceInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif, audio/webm, audio/mp4, audio/ogg, audio/mpeg, audio/wav, video/webm, video/mp4, video/quicktime]
        size:
          type: integer
          minimum: 1
          maximum: 20971520
        objectPath:
          type: string
          pattern: "^/objects/evidence/[a-f0-9-]{36}$"
        previewToken:
          type: string
          minLength: 1
          maxLength: 2048
      required: [name, type, size, objectPath, previewToken]
    TrafficReportEvidence:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        size: { type: integer }
      required: [name, type, size]
    TrafficReportAnalysis:
      type: object
      properties:
        summary:
          type: string
          maxLength: 500
        urgency:
          type: string
          enum: [low, medium, high]
        suggestedCategory:
          type: string
          enum: [speeding, pothole, unsafe_crossing, distracted_driving, unsafe_driving, streetlight, illegal_dumping, other]
        recommendedAction:
          type: string
          maxLength: 500
      required: [summary, urgency, suggestedCategory, recommendedAction]
    TrafficReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reportNumber:
          type: string
        category:
          type: string
        location:
          type: ["string", "null"]
        originalReport:
          $ref: "#/components/schemas/TrafficReportOriginal"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/TrafficReportEvidence"
        analysis:
          oneOf:
            - $ref: "#/components/schemas/TrafficReportAnalysis"
            - type: "null"
        analysisStatus:
          type: string
          enum: [pending, complete, unavailable]
        status:
          type: string
          enum: [submitted]
        submittedAt:
          type: string
          format: date-time
        language:
          type: string
        englishTranslation:
          oneOf:
            - $ref: "#/components/schemas/ReportTranslationResponse"
            - type: "null"
      required: [id, reportNumber, category, location, originalReport, evidence, analysis, analysisStatus, status, submittedAt, language, englishTranslation]
    TrafficReportHistory:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/TrafficReport"
        viewer:
          type: string
          enum: [resident, staff]
      required: [reports, viewer]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required:
        - error

