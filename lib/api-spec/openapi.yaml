openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Private object storage for resident evidence.
  - name: Translation
    description: English translations for City staff review.
  - name: Maps
    description: Browser configuration for the address map.
paths:
  /maps/config:
    get:
      operationId: getMapsConfig
      tags: [Maps]
      summary: Get the browser-restricted Google Maps key
      responses:
        "200":
          description: Maps JavaScript API configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapsConfig"
        "503":
          description: Google Maps is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/evidence:
    post:
      operationId: uploadEvidence
      tags: [Storage]
      summary: Upload private photo evidence
      description: Uploads one validated image to managed private object storage.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          image/gif:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Evidence stored in private object storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUploadResponse"
        "400":
          description: The uploaded bytes are not a supported image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The image exceeds the 3 MB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "415":
          description: The content type is not supported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The evidence could not be stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      operationId: getEvidenceObject
      tags: [Storage]
      summary: Serve a private evidence object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Private evidence path without the /objects/ prefix.
      responses:
        "200":
          description: Stored image evidence.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Evidence object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: The evidence could not be served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /translate/report:
    post:
      operationId: translateReport
      tags: [Translation]
      summary: Translate resident report text into English
      description: Preserves the resident's original text and returns an English translation for City staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportTranslationInput"
      responses:
        "200":
          description: English translation of the resident-entered report fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTranslationResponse"
        "400":
          description: Invalid translation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Translation service is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Translation provider failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    MapsConfig:
      type: object
      properties:
        apiKey:
          type: string
      required:
        - apiKey
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EvidenceUploadResponse:
      type: object
      properties:
        objectPath:
          type: string
          description: Private object path returned by the evidence service.
        contentType:
          type: string
        size:
          type: integer
      required:
        - objectPath
        - contentType
        - size
    ReportTranslationInput:
      type: object
      properties:
        sourceLanguage:
          type: string
          minLength: 2
          maxLength: 10
        location:
          type: string
          maxLength: 300
        approximateTime:
          type: string
          maxLength: 100
        description:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - sourceLanguage
        - location
        - approximateTime
        - description
    ReportTranslationResponse:
      type: object
      properties:
        location:
          type: string
        approximateTime:
          type: string
        description:
          type: string
      required:
        - location
        - approximateTime
        - description
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required:
        - error

